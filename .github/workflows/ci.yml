name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Deploy requirements cover the runtime deps used by app.py and tests
          # (tensorflow-cpu, opencv-headless, numpy, pillow, streamlit).
          pip install -r requirements-deploy.txt scikit-learn pytest

      - name: Run tests
        # Model weights are gitignored, so model-dependent paths rely on a tiny
        # in-test dummy model; tests are self-contained and need no dataset.
        run: pytest tests/ -v
